<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Left lens -->
  <rect x="4" y="22" width="24" height="18" rx="9" stroke="#6366f1" stroke-width="3.5" fill="none"/>
  <!-- Right lens -->
  <rect x="36" y="22" width="24" height="18" rx="9" stroke="#6366f1" stroke-width="3.5" fill="none"/>
  <!-- Bridge -->
  <path d="M28 31 Q32 27 36 31" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Left arm -->
  <line x1="4" y1="31" x2="1" y2="31" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="60" y1="31" x2="63" y2="31" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left lens shine -->
  <circle cx="12" cy="27" r="2" fill="#818cf8" opacity="0.6"/>
  <!-- Right lens shine -->
  <circle cx="44" cy="27" r="2" fill="#818cf8" opacity="0.6"/>
</svg>
